name: Deploy to GitHub Pages

# main is the branch the github-pages environment is allowed to deploy
# from, so publishing is driven off pushes there. It can also be started
# by hand from the Actions tab.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one deployment at a time, but let in-flight ones finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Package site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repository root: index.html, about.html,
          # projects.html, contact.html and assets/
          path: .

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
